tolerance: 0.0005
# Figures in the manuscript that are NOT analysis outputs. Each entry is anchored to the
# context it is allowed in: a bare value would wave the same digits through anywhere in the
# paper, including a result that happened to print them. `context` is a regular expression
# that must match within 60 characters of the figure.
manuscript_number_allowlist:
- value: '2.6'
  context: "Z''"
  reason: Altman Z'' SAFE/WATCH cut-off, an external constant from the scoring model
- value: '1.1'
  context: "Z''"
  reason: Altman Z'' WATCH/DISTRESS cut-off, same source
- value: '2.5'
  context: 'gemini-2\.5-flash'
  reason: part of the incumbent Google model identifier, not a measurement
- value: '3.5'
  context: 'gemini-3\.5-flash'
  reason: part of the successor Google model identifier
- value: '5.4'
  context: 'gpt-5\.4-nano'
  reason: part of the successor OpenAI model identifier
- value: '10.24433'
  context: 'doi|DOI'
  reason: Code Ocean DOI prefix
